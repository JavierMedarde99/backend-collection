# Servidor
server.port=8080
spring.application.name=wiki-collection-backend

# MongoDB
spring.mongodb.uri=${SPRING_MONGODB_URI:mongodb://localhost:27017/wiki-collection}
# Los índices se crean de forma explícita/automática según entorno; evita fallos de arranque si Mongo no responde.
spring.data.mongodb.auto-index-creation=false

# Google Books API
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}

# Logging
logging.level.org.springframework.data.mongodb=INFO