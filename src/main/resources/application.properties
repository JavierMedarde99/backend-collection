# Servidor
server.port=8080
spring.application.name=wiki-collection-backend

# Política HTTP centralizada para clientes externos
http.client.connect-timeout=5s
http.client.read-timeout=10s

# MongoDB
spring.mongodb.uri=mongodb://user:pass@127.0.0.1:27017/?authSource=admin&directConnection=true
spring.mongodb.database=collection
# Los índices se crean de forma explícita/automática según entorno; evita fallos de arranque si Mongo no responde.
spring.data.mongodb.auto-index-creation=false

# Google Books API
google.books.api-key=${GOOGLE_BOOKS_API_KEY:}

# RAWG API
rawg.api-key=${RAWG_API_KEY:}

# Steam API
steam.api-key=${STEAM_API_KEY:}

# Scryfall API (Magic: The Gathering)
# URL base de la API publica de Scryfall.
scryfall.api.base-url=https://api.scryfall.com
# Reintentos ante 5xx/timeout (ademas del intento inicial).
scryfall.api.retry-attempts=3
# Espera entre reintentos, en milisegundos.
scryfall.api.retry-delay-ms=1000
# Pausa minima entre peticiones, en milisegundos. Scryfall pide no superar
# ~10 peticiones/segundo, asi que 100 ms es el maximo seguro por defecto.
scryfall.api.rate-limit-delay-ms=100

# BoardGameGeek (BGG) XML API2
bgg.api.xml-url=https://boardgamegeek.com/xmlapi2
bgg.api.retry-attempts=3
bgg.api.retry-delay-ms=2000
bgg.auth.token=${BGG_AUTH_TOKEN:}

# TMDB API (películas y series)
tmdb.api-key=${TMDB_API_KEY:}
tmdb.api.base-url=https://api.themoviedb.org/3
tmdb.api.retry-attempts=3
tmdb.api.retry-delay-ms=1000

# Logging
logging.level.org.springframework.data.mongodb=INFO

# Explicitly direct Swagger UI to your local OpenAPI schema path
springdoc.swagger-ui.config-url=/v3/api-docs/swagger-config
springdoc.swagger-ui.url=/v3/api-docs